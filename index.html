<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c2426"><title>Utash — пиксельная деревня</title><meta name="description" content="Тихий вечер в пиксельной деревне. Интерактивная погода и пять планов пейзажа."><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><header><a class="brand" href="./">UTASH<span>ПИКСЕЛЬНЫЙ МИР</span></a><span class="edition">01 / ДЕРЕВНЯ</span><button id="fullscreen" title="Полный экран">На весь экран ↗</button></header>
<main><div class="intro"><div><p class="eyebrow">МЕСТО, ГДЕ МОЖНО ЗАМЕДЛИТЬСЯ</p><h1>Тихий вечер.</h1></div><p>Лес на горизонте. Дом у поля.<br>И погода, которую выбираешь ты.</p></div>
<section class="landscape" aria-label="Пиксельная деревня"><div id="scene"></div><div id="status" role="status">Загружаем деревню…</div><div class="scene-label"><span>УТАШ / СЕЛЬСКИЙ ПЕЙЗАЖ</span><span id="clock">18:30</span></div></section>
<section class="controls" aria-label="Атмосфера"><div class="presets"><span class="eyebrow">НАСТРОЕНИЕ</span><div><button data-preset="evening" aria-pressed="true">Вечер</button><button data-preset="mist" aria-pressed="false">Туман</button><button data-preset="rain" aria-pressed="false">Дождь</button><button data-preset="original" aria-pressed="false">Исходная сцена</button></div></div><div class="sliders"><label>Время суток <output id="time-value">18:30</output><input id="time" type="range" min="0" max="24" step="0.25" value="18.5"></label><label>Облака <output id="cloud-value">20%</output><input id="cloud" type="range" min="0" max="1" step="0.01" value="0.2"></label><label>Туман <output id="fog-value">0%</output><input id="fog" type="range" min="0" max="1" step="0.01" value="0"></label><label>Дождь <output id="rain-value">0%</output><input id="rain" type="range" min="0" max="1" step="0.01" value="0"></label></div><div class="actions"><button id="pause" aria-pressed="false">Пауза</button><button id="save">Сохранить настройки ↓</button></div></section></main><footer><span>UTASH — маленький мир, свой ритм.</span><span>ATMOSPHERE ENGINE / 0.4.0</span></footer><script type="module" src="app.js"></script></body></html>
